<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&O - Projeto Oficial</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0b3c5d">
<meta name="referrer" content="always">

<style>
:root{--bg:#f6f8fb;--card:#fff;--primary:#0b3c5d;--text:#2c2c2c;--muted:#777;}
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:10px;}
.card{width:100%;max-width:420px;background:var(--card);border-radius:16px;padding:20px;box-shadow:0 10px 25px rgba(0,0,0,.08);display:none;min-height:550px;flex-direction:column;position:relative}
.card.active{display:flex}
h2,h3{text-align:center;margin:10px 0}
button{width:100%;padding:15px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}
button[disabled]{opacity:.5}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #ddd;margin:8px 0}
.timer{font-size:34px;text-align:center;margin:15px 0;font-weight:bold;color:var(--primary)}
.actions{display:flex;gap:10px}
.actions button{flex:1}
.muted{font-size:13px;color:var(--muted);line-height:1.4;text-align:center}
.ad-area{flex-grow:1;border:1px dashed #ddd;border-radius:8px;display:flex;align-items:center;justify-content:center;margin:10px 0;overflow:hidden}
.page-points{text-align:center;font-size:26px;font-weight:bold;color:var(--primary)}
.user-icon{position:absolute;top:15px;right:15px;width:44px;height:44px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.link{font-size:12px;text-align:center;margin-top:8px}
.link a{color:#0b3c5d;text-decoration:none}
</style>
</head>

<body>
