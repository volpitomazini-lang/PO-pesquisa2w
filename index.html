<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P&O - Projeto Oficial</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0b3c5d">
    
    <script>(function(s){s.dataset.zone='10477360',s.src='https://gizokraijaw.net/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

    <style>
        :root{--bg:#f6f8fb;--card:#ffffff;--primary:#0b3c5d;--text:#2c2c2c;--muted:#777;}
        *{box-sizing:border-box;font-family:Arial,sans-serif}
        body{margin:0;background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:10px;}
        .card{width:100%;max-width:420px;background:var(--card);border-radius:16px;padding:20px;box-shadow:0 10px 25px rgba(0,0,0,.08);display:none !important;position:relative;min-height:550px;flex-direction:column;}
        .card.active{display:flex !important;}
        .user-icon{position:absolute;top:15px;right:15px;cursor:pointer;background:var(--primary);color:#fff;width:45px;height:45px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:22px;z-index:100;}
        h2,h3{text-align:center;margin:10px 0;}
        
        /* Botões reais para Telas de Login/Acordo */
        button.btn-padrao{width:100%;padding:15px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px;}
        
        /* Links que parecem botões para Telas de Avaliação (Engana a Monetag) */
        .btn-link{display:block;width:100%;padding:15px;border-radius:10px;background:var(--primary);color:#fff;text-align:center;text-decoration:none;font-size:16px;font-weight:bold;margin-top:10px;cursor:pointer;}
        .btn-link.disabled{opacity:.5;pointer-events:none;filter:grayscale(1);}
        
        input{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:1px solid #ddd;margin-bottom:10px;}
        .timer{font-size:35px;text-align:center;margin:15px 0; font-weight:bold; color:var(--primary);}
        .page-points{font-size:24px;font-weight:bold;text-align:center;color:var(--primary);margin-bottom:15px}
        .actions{display:flex;gap:10px;margin-bottom: 20px;}
        .actions a{flex:1}
        .ad-area{flex-grow: 1; background: #fafafa; border: 1px dashed #ddd; margin: 10px 0; display: flex; align-items: center; justify-content: center; text-align: center; border-radius: 8px; overflow: hidden;}
        .muted{color:var(--muted);font-size:13px;text-align:center;line-height:1.4}
    </style>
</head>
<body>

    <div id="t1" class="card active">
        <h2>Projeto P&O</h2>
        <p class="muted">Ao continuar, voce concorda com os termos do projeto O&P.</p>
        <button class="btn-padrao" onclick="showCard('t2')">Continuar</button>
    </div>

    <div id="t2" class="card">
        <h2>Acesso</h2>
        <input id="email" type="email" placeholder="Email">
        <input id="pix" type="text" placeholder="Chave PIX">
        <button class="btn-padrao" onclick="login()">Entrar no Sistema</button>
    </div>

    <div id="t3" class="card">
        <div class="user-icon" onclick="showCard('t_user')">👤</div>
        <div class="page-points pts-display">0000</div>
        <div class="ad-area">
            <script>(function(s){s.dataset.zone='10479113',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
        </div>
        <div id="timer30" class="timer">30</div>
        <div class="actions">
            <a href="javascript:void(0)" id="like" class="btn-link disabled" onclick="chamarVignette('t4')">Gostei</a>
            <a href="javascript:void(0)" id="dislike" class="btn-link disabled" onclick="chamarVignette('t4')">Não gostei</a>
        </div>
    </div>

    <div id="t4" class="card">
        <div class="page-points pts-display">0000</div>
        <div class="ad-area"></div>
        <h3>Este conteudo foi util?</h3>
        <div id="timer10a" class="timer">10</div>
        <div class="actions">
            <a href="javascript:void(0)" id="uSim" class="btn-link disabled" onclick="chamarVignette('t5')">Sim</a>
            <a href="javascript:void(0)" id="uNao" class="btn-link disabled" onclick="chamarVignette('t5')">Não</a>
        </div>
    </div>

    <div id="t5" class="card">
        <div class="page-points pts-display">0000</div>
        <div class="ad-area"></div>
        <h3>Voce indicaria este produto?</h3>
        <div id="timer10b" class="timer">10</div>
        <div class="actions">
            <a href="javascript:void(0)" id="iSim" class="btn-link disabled" onclick="chamarVignette('t6')">Sim</a>
            <a href="javascript:void(0)" id="iNao" class="btn-link disabled" onclick="chamarVignette('t6')">Não</a>
        </div>
    </div>

    <div id="t6" class="card">
        <div class="page-points pts-display">0000</div>
        <div class="ad-area">
            <script>(function(s){s.dataset.zone='10460180',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
        </div>
        <div id="timer10c" class="timer">10</div>
        <div id="resgateArea">
            <a href="javascript:void(0)" id="btnResgate" class="btn-link disabled" onclick="executarResgate()">Resgatar Agora</a>
        </div>
        <div id="sucessoArea" style="display:none; text-align:center;">
            <p style="color: green; font-weight: bold;">+1 Ponto Adicionado!</p>
            <button class="btn-padrao" onclick="finalizarCiclo()">Voltar ao Inicio</button>
        </div>
    </div>

    <div id="t_user" class="card">
        <h2>Perfil</h2>
        <button class="btn-padrao" onclick="showCard('t3')" style="background:#888;">Voltar</button>
    </div>

    <script>
        let pontos = parseInt(localStorage.getItem('pontos_po')) || 0;
        let tempoAtivo;

        function updatePointsDisplay() {
            document.querySelectorAll('.pts-display').forEach(el => el.innerText = pontos.toString().padStart(4, '0'));
        }

        function showCard(id) {
            if(tempoAtivo) clearInterval(tempoAtivo);
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            updatePointsDisplay();
            
            if(id === 't3') startTimer(30, 'timer30', ['like', 'dislike'], true);
            if(id === 't4') startTimer(10, 'timer10a', ['uSim', 'uNao'], false);
            if(id === 't5') startTimer(10, 'timer10b', ['iSim', 'iNao'], false);
            if(id === 't6') startTimer(10, 'timer10c', ['btnResgate'], false);
        }

        function startTimer(segundos, displayId, botoesIds, temGatilho) {
            let tempo = segundos;
            const display = document.getElementById(displayId);
            botoesIds.forEach(id => document.getElementById(id).classList.add('disabled'));
            
            tempoAtivo = setInterval(() => {
                tempo--;
                display.innerText = tempo;
                
                // GATILHO 10s (Timer no 20)
                if(temGatilho && tempo === 20) {
                    if (typeof show_10477360 === 'function') show_10477360().catch(()=>{});
                }
                
                if(tempo <= 0) {
                    clearInterval(tempoAtivo);
                    botoesIds.forEach(id => document.getElementById(id).classList.remove('disabled'));
                }
            }, 1000);
        }

        function chamarVignette(proxima) {
            if (typeof show_10477360 === 'function') {
                show_10477360().then(() => showCard(proxima)).catch(() => showCard(proxima));
            } else {
                showCard(proxima);
            }
        }

        function login() { showCard('t3'); }
        function executarResgate() {
            pontos++; localStorage.setItem('pontos_po', pontos);
            document.getElementById('resgateArea').style.display = 'none';
            document.getElementById('sucessoArea').style.display = 'block';
            updatePointsDisplay();
        }
        function finalizarCiclo() {
            document.getElementById('resgateArea').style.display = 'block';
            document.getElementById('sucessoArea').style.display = 'none';
            showCard('t3');
        }

        window.onload = updatePointsDisplay;
    </script>
</body>
</html>
