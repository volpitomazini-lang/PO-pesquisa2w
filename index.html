<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P e O - Pesquisa e Opinioes</title>
<meta name="monetag" content="d26d9bd450c596ece045b5d4672c7257">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b3c5d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{ --azul-claro:#e6f0fa; --azul-escuro:#0b3c5d; --dourado:#f1c40f; --verde:#1e8e3e; --cinza:#f5f5f5; }
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{margin:0;background:var(--azul-claro);color:#333;padding-top:70px;padding-bottom: 70px;}
.hidden{display:none}
.screen{padding:20px}
h1,h2,h3{color:var(--azul-escuro)}
button{width:100%;padding:14px;border:none;border-radius:8px;font-size:16px;cursor:pointer}
button:disabled{background:#ccc;cursor:not-allowed}
.primary{background:var(--azul-escuro);color:#fff}
.card{background:#fff;padding:16px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.08);margin-bottom:16px}
input{width:100%;padding:12px;margin-top:6px;margin-bottom:12px;border-radius:6px;border:1px solid #ccc}
.video-box{background:#000;height:180px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:12px;font-size:28px;position:relative}
.actions{display:flex;gap:20px;justify-content:center}
.actions button{width:60px;height:60px;font-size:28px;border-radius:50%}
.counter{text-align:center;font-size:14px;margin-bottom:8px;font-weight:bold}
.nav{position:fixed;bottom:60px;left:0;width:100%;height:50px;background:#fff;border-top:1px solid #ccc;display:flex;z-index:999}
.nav button{flex:1;border:none;background:none;font-size:14px}
#topBar{position:fixed;top:0;width:100%;height:65px;background:var(--azul-escuro);color:#fff;display:none;justify-content:space-between;align-items:center;padding:0 15px;z-index:1000}

.banner-fixed { width: 100%; text-align: center; background: #fff; display: none; overflow: hidden; }
#banner-top { margin-top: -5px; margin-bottom: 10px; }
#banner-bottom { position: fixed; bottom: 0; left: 0; height: 60px; z-index: 1001; border-top: 1px solid #ddd; }
</style>
</head>
<body>

<div id="topBar">
    <span style="font-weight:bold; font-size:18px;">P e O</span>
    <span style="color:var(--dourado); font-weight:bold; font-size:18px;">R$ <span id="valSaldo">0,00</span></span>
</div>

<div id="banner-top" class="banner-fixed">
    <small style="color:#999">Publicidade</small>
</div>

<div id="welcome" class="screen">
  <h1>P e O - Pesquisa e Opinioes</h1>
  <p>Ganhe por sua opinião honesta.</p>
  <button class="primary" onclick="showScreen('cadastro')">LI E CONCORDO</button>
</div>

<div id="cadastro" class="screen hidden">
  <h2>Cadastro</h2>
  <div class="card">
    <input id="regEmail" placeholder="Seu melhor E-mail">
    <input id="regPix" placeholder="Chave PIX para resgate">
    <button class="primary" onclick="finalizarCadastro()">SALVAR E ENTRAR</button>
  </div>
</div>

<div id="videos" class="screen hidden">
  <div class="video-box">PUBLICIDADE 📺</div>
  <div class="counter" id="counter">Aguarde 30s</div>
  <div class="actions">
    <button id="like" disabled onclick="gatilhoAnuncio('pesquisa')">👍</button>
    <button id="dislike" disabled onclick="gatilhoAnuncio('pesquisa')">👎</button>
  </div>
</div>

<div id="pesquisa" class="screen hidden">
  <h2>Pesquisa Rápida</h2>
  <div class="card">
    <p>Você indicaria este serviço para amigos ou familiares?</p>
    <button class="primary" onclick="gatilhoAnuncio('resgate')">COM CERTEZA</button><br><br>
    <button class="primary" onclick="gatilhoAnuncio('resgate')" style="background:#777">TALVEZ</button>
  </div>
</div>

<div id="resgate" class="screen hidden">
  <h2>Resgate</h2>
  <div class="card" style="text-align:center">
    <h3 style="color:var(--verde)">Saldo: R$ 0,01</h3>
    <p>Clique abaixo para processar seu pagamento.</p>
    <button id="btnResgate" class="primary" onclick="tentarResgate()">RESGATAR AGORA</button>
  </div>
</div>

<div id="perfil" class="screen hidden">
  <h2>Seu Perfil</h2>
  <div class="card">
    <p><strong>E-mail:</strong> <span id="pEmail"></span></p>
    <p><strong>PIX:</strong> <span id="pPix"></span></p>
    <button class="primary" style="background:#c0392b" onclick="logout()">SAIR DA CONTA</button>
  </div>
</div>

<div id="navBar" class="nav hidden">
  <button onclick="showScreen('videos')">🎬 Início</button>
  <button onclick="showScreen('perfil')">👤 Perfil</button>
</div>

<div id="banner-bottom" class="banner-fixed"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyCA_Vatr685QLHRI6M-X2Xt_0mH_YM-IeA", authDomain: "atitude-solidaria.firebaseapp.com", projectId: "atitude-solidaria", storageBucket: "atitude-solidaria.firebasestorage.app", messagingSenderId: "651411468618", appId: "1:651411468618:web:3c4e77ba3b99634469d1b3" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.gatilhoAnuncio = (proximaTela) => {
    window.open("https://otieu.com/4/10454714", "_blank"); 
    if(proximaTela) showScreen(proximaTela);
};

window.showScreen = (id) => {
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
    
    const logado = (id !== 'welcome' && id !== 'cadastro');
    document.getElementById('topBar').style.display = logado ? 'flex' : 'none';
    document.getElementById('navBar').style.display = logado ? 'flex' : 'none';
    document.getElementById('banner-top').style.display = logado ? 'block' : 'none';
    document.getElementById('banner-bottom').style.display = logado ? 'block' : 'none';

    if(id === 'videos') iniciarTimer();
    if(id === 'perfil') carregarPerfil();
};

let timer;
function iniciarTimer(){
    clearInterval(timer);
    let time = 30;
    document.getElementById('like').disabled = true;
    document.getElementById('dislike').disabled = true;
    
    timer = setInterval(()=>{
        time--;
        document.getElementById('counter').textContent = `Aguarde ${time}s`;
        
        if(time === 20) {
            window.open("https://otieu.com/4/10454714", "_blank");
        }

        if(time <= 0){
            clearInterval(timer);
            document.getElementById('counter').textContent = 'O que achou deste anúncio?';
            document.getElementById('like').disabled = false;
            document.getElementById('dislike').disabled = false;
        }
    },1000);
}

window.finalizarCadastro = async () => {
    const email = document.getElementById('regEmail').value.trim().toLowerCase();
    const pix = document.getElementById('regPix').value.trim();
    if (!email || !pix) return alert("Preencha todos os campos!");
    try {
        await setDoc(doc(db, "usuarios", email), { email, pix, saldo: 0 }, { merge: true });
        localStorage.setItem('user_email', email);
        showScreen('videos');
    } catch (e) { alert("Erro de conexão."); }
};

window.tentarResgate = () => {
    gatilhoAnuncio(); 
    const btn = document.getElementById('btnResgate');
    btn.disabled = true;
    btn.textContent = "Processando PIX...";
    setTimeout(finalizarCiclo, 2000);
};

async function finalizarCiclo() {
    const email = localStorage.getItem('user_email');
    try {
        const docRef = doc(db, "usuarios", email);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
            let novoSaldo = (parseFloat(docSnap.data().saldo) || 0) + 0.01;
            await updateDoc(docRef, { saldo: novoSaldo });
            alert("R$ 0,01 enviado para sua conta!");
            gatilhoAnuncio('videos'); 
        }
    } catch(e) { console.log(e); }
    document.getElementById('btnResgate').disabled = false;
    document.getElementById('btnResgate').textContent = "RESGATAR AGORA";
}

async function carregarPerfil(){
    const email = localStorage.getItem('user_email');
    if(!email) return;
    const docSnap = await getDoc(doc(db, "usuarios", email));
    if(docSnap.exists()){
        const data = docSnap.data();
        document.getElementById('valSaldo').textContent = (data.saldo || 0).toFixed(2).replace('.',',');
        document.getElementById('pEmail').textContent = data.email;
        document.getElementById('pPix').textContent = data.pix;
    }
}

window.logout = () => { localStorage.clear(); location.reload(); };

window.onload = () => {
    if(localStorage.getItem('user_email')) showScreen('videos');
    else showScreen('welcome');
};
</script>
</body>
</html>
