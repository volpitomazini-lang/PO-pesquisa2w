<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P e O - Pesquisa e Opiniões</title>
<meta name="monetag" content="d26d9bd450c596ece045b5d4672c7257">
<style>
    :root{ --azul-claro:#f0f4f8; --azul-escuro:#0b3c5d; --dourado:#f1c40f; --verde:#1e8e3e; }
    *{box-sizing:border-box;font-family:Arial, sans-serif}
    body{margin:0;background:var(--azul-claro);color:#333;padding-top:70px;padding-bottom: 110px;}
    .hidden{display:none}
    .screen{padding:20px; text-align:center;}
    h1,h2{color:var(--azul-escuro); font-size: 22px;}
    button{width:100%;padding:16px;border:none;border-radius:8px;font-size:16px;cursor:pointer;font-weight:bold}
    button:disabled{background:#ccc !important; cursor:not-allowed}
    .primary{background:var(--azul-escuro);color:#fff}
    .card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.1);margin-bottom:16px;text-align:left; line-height: 1.6;}
    input{width:100%;padding:15px;margin-bottom:12px;border:1px solid #ccc;border-radius:8px;font-size:16px}
    .video-box{background:#000;height:180px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:12px;font-size:20px; border: 2px solid var(--azul-escuro)}
    .counter{text-align:center;font-size:18px;margin-bottom:10px;font-weight:bold;color:#e74c3c}
    #topBar{position:fixed;top:0;width:100%;height:65px;background:var(--azul-escuro);color:#fff;display:none;justify-content:space-between;align-items:center;padding:0 15px;z-index:1000}
    .anuncio-topo { text-align: center; margin: 10px 0; min-height: 50px; width: 100%; background:#f9f9f9; }
    .anuncio-rodape { position: fixed; bottom: 0; left: 0; width: 100%; text-align: center; background: rgba(240, 244, 248, 0.95); padding: 5px 0; z-index: 999; border-top: 1px solid #ccc; min-height: 50px; }
</style>
</head>
<body>

<div id="topBar">
    <span style="font-weight:bold;">P e O</span>
    <span style="color:var(--dourado);">R$ <span id="valSaldo">0,00</span></span>
</div>

<div class="anuncio-topo">
    <script data-cfasync="false" type="text/javascript" src="//gizokraijaw.net/al/a.js"></script>
    <ins class="66a0e698" data-zone="10477360"></ins>
</div>

<div id="welcome" class="screen">
  <h1>Contrato de Participação P&O</h1>
  <div class="card"><p>Analise produtos e acumule recompensas trimestrais.</p></div>
  <button class="primary" onclick="showScreen('cadastro')">LI E CONCORDO</button>
</div>

<div id="cadastro" class="screen hidden">
  <h2>Identificação</h2>
  <div class="card">
    <input id="regEmail" type="email" placeholder="Seu melhor E-mail">
    <input id="regPix" placeholder="Sua Chave PIX">
    <button class="primary" onclick="salvarCadastro()">ACESSAR PAINEL</button>
  </div>
</div>

<div id="videos" class="screen hidden">
  <div class="video-box">PRODUTO EM ANÁLISE 📊</div>
  <div class="counter" id="counter">Aguarde 10s</div>
  <div style="display:flex; gap:10px;">
    <button id="like" disabled onclick="irParaPesquisa()" style="background:var(--verde); color:white">GOSTEI</button>
    <button id="dislike" disabled onclick="irParaPesquisa()" style="background:#c0392b; color:white">NÃO GOSTEI</button>
  </div>
</div>

<div id="pesquisa" class="screen hidden">
  <h2>Opinião</h2>
  <div class="card">
    <p>Este produto atende você?</p>
    <button class="primary" onclick="showScreen('resgate')">SIM</button><br><br>
    <button class="primary" onclick="showScreen('resgate')" style="background:#777">NÃO</button>
  </div>
</div>

<div id="resgate" class="screen hidden">
  <h2>Conclusão</h2>
  <div class="card" style="text-align:center">
    <h3 style="color:var(--verde)">Sua participação foi salva!</h3>
    <button class="primary" onclick="finalizarCiclo()">AVALIAR PRÓXIMO</button>
  </div>
</div>

<div class="anuncio-rodape">
    <script data-cfasync="false" type="text/javascript" src="//gizokraijaw.net/al/a.js"></script>
    <ins class="66a0e698" data-zone="10477360"></ins>
</div>

<script>
const DIRECT_LINK = "https://otieu.com/4/10454714";
let saldoAtual = parseFloat(localStorage.getItem('saldo_usuario')) || 0.00;

function atualizarDisplaySaldo() {
    document.getElementById('valSaldo').textContent = saldoAtual.toFixed(2).replace('.', ',');
}

// Vignette CORRIGIDO
function carregarVignette() {
    const s = document.createElement('script');
    s.dataset.zone = '10477360';
    s.src = 'https://gizokraijaw.net/vignette.min.js';
    document.body.appendChild(s);
}

window.showScreen = (id) => {
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
    const painelAtivo = (id === 'videos' || id === 'pesquisa' || id === 'resgate');
    document.getElementById('topBar').style.display = painelAtivo ? 'flex' : 'none';
    if(id === 'videos') iniciarTimer();
};

function iniciarTimer(){
    let time = 10;
    const btnL = document.getElementById('like'); 
    const btnD = document.getElementById('dislike');
    btnL.disabled = true; btnD.disabled = true;
    let countdown = setInterval(()=>{
        time--;
        document.getElementById('counter').textContent = `Analisando: ${time}s`;
        if(time <= 0){
            clearInterval(countdown);
            document.getElementById('counter').textContent = 'O que achou?';
            btnL.disabled = false; btnD.disabled = false;
        }
    }, 1000);
}

function salvarCadastro() {
    const email = document.getElementById('regEmail').value;
    if(!email) return alert("Digite seu e-mail");
    localStorage.setItem('user_email', email);
    carregarVignette(); 
    showScreen('videos');
}

function irParaPesquisa() {
    window.open(DIRECT_LINK, "_blank"); 
    showScreen('pesquisa');
}

window.finalizarCiclo = () => {
    saldoAtual += 0.01;
    localStorage.setItem('saldo_usuario', saldoAtual.toFixed(2)); 
    atualizarDisplaySaldo(); // CORREÇÃO: Faz o saldo mudar na tela na hora
    window.open(DIRECT_LINK, "_blank"); 
    showScreen('videos');
};

window.onload = () => {
    atualizarDisplaySaldo();
    if(localStorage.getItem('user_email')) {
        carregarVignette();
        showScreen('videos');
    }
};
</script>
</body>
</html>
